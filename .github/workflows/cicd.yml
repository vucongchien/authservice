name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. CI: Quality Gates (Linter, Typecheck, Unit Tests, Stress Tests)
  # ============================================================================
  test:
    name: Run Unit & Concurrency Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome Linter & Format Check
        run: bun run lint

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Run Unit & E2E Test Suite
        run: bun test

      - name: Run Anti-Race Condition Stress Tests
        run: bun run test:stress

  # ============================================================================
  # 2. CD: Build & Publish Docker Container to GitHub Container Registry (GHCR)
  # ============================================================================
  docker-publish:
    name: Build & Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================================================
  # 3. CD: Trigger Render Continuous Deployment Hook
  # ============================================================================
  deploy-render:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: [test, docker-publish]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    steps:
      - name: Call Render Deploy Hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "ℹ️ Secret RENDER_DEPLOY_HOOK_URL chưa được cấu hình trong GitHub Repo Secrets."
            echo "💡 Để kích hoạt deploy Render tự động: Vào GitHub Repo Settings -> Secrets -> Actions -> Thêm RENDER_DEPLOY_HOOK_URL."
          else
            echo "🚀 Đang gửi webhook kích hoạt Render Deploy..."
            curl -fsS -X POST "$HOOK_URL"
            echo "✅ Render deployment đã được kích hoạt thành công!"
          fi
