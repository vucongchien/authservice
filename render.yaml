# ==============================================================================
# Render Blueprint Specification (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # 1. AuthService Web Application (Docker Runtime)
  - type: web
    name: auth-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: BASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: POSTGRES_SCHEMA
        value: auth_service
      - key: DATABASE_URL
        fromDatabase:
          name: auth-db
          property: connectionString
      - key: JWT_ISSUER
        value: authservice
      - key: JWT_AUDIENCE
        value: authservice-clients
      - key: ACCESS_TOKEN_TTL
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 14
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

# 2. Managed PostgreSQL Database (Free Tier)
databases:
  - name: auth-db
    plan: free
    region: singapore
    databaseName: auth_db
    user: auth_user
